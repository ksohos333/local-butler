<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geonews — Primary Source News + Prediction Markets</title>
    <link rel="stylesheet" href="/static/vendor/leaflet.css" />
    <link rel="stylesheet" href="/static/vendor/MarkerCluster.css" />
    <link rel="stylesheet" href="/static/vendor/MarkerCluster.Default.css" />
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --panel-2: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --conflict: #ef4444;
            --economic: #eab308;
            --political: #3b82f6;
            --environmental: #22c55e;
            --other: #a855f7;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        #app {
            display: grid;
            grid-template-columns: 420px 1fr;
            grid-template-rows: 48px 1fr 28px;
            height: 100vh;
        }

        header {
            grid-column: 1 / -1;
            background: var(--panel);
            border-bottom: 1px solid var(--panel-2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px 0 16px;
        }

        header .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #menu-btn {
            background: transparent;
            border: none;
            color: var(--text);
            cursor: pointer;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            border-radius: 4px;
        }

        #menu-btn:hover {
            background: var(--panel-2);
        }

        #menu-btn span {
            display: block;
            width: 18px;
            height: 2px;
            background: currentColor;
            border-radius: 1px;
        }

        #menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 2500;
            display: none;
        }

        #menu-overlay.visible {
            display: block;
        }

        #menu-drawer {
            position: fixed;
            top: 0;
            right: 0;
            width: 240px;
            height: 100%;
            background: var(--panel);
            border-left: 1px solid var(--panel-2);
            z-index: 2600;
            transform: translateX(100%);
            transition: transform 0.2s ease, visibility 0.2s ease;
            visibility: hidden;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            padding: 16px;
        }

        #menu-drawer.visible {
            transform: translateX(0);
            visibility: visible;
            pointer-events: auto;
        }

        .menu-item {
            background: transparent;
            border: none;
            color: var(--text);
            text-align: left;
            padding: 12px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 6px;
        }

        .menu-item:hover, .menu-item.active {
            background: var(--panel-2);
        }

        .drawer-close {
            align-self: flex-end;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
            margin-bottom: 12px;
        }

        header h1 {
            font-size: 18px;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        header .badge {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            border: 1px solid var(--panel-2);
            padding: 2px 8px;
            border-radius: 12px;
        }

        #left-pane {
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--panel-2);
            overflow: hidden;
        }

        #tabs {
            display: flex;
            background: var(--panel);
            border-bottom: 1px solid var(--panel-2);
        }

        .tab {
            flex: 1;
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 10px;
            font-size: 13px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .tab.active {
            color: var(--text);
            border-bottom-color: var(--accent);
        }

        .tab:hover {
            color: var(--text);
            background: var(--panel-2);
        }

        .hidden { display: none !important; }

        #controls {
            padding: 12px;
            background: var(--panel);
            border-bottom: 1px solid var(--panel-2);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #search-row {
            display: flex;
            gap: 8px;
        }

        #search-input {
            flex: 1;
            background: var(--bg);
            color: var(--text);
            border: 1px solid #475569;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 13px;
        }

        #search-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        #layers {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .layer-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--panel-2);
            border: 1px solid var(--panel-2);
            color: var(--text-muted);
            border-radius: 12px;
            padding: 4px 10px;
            font-size: 12px;
            cursor: pointer;
            user-select: none;
        }

        .layer-chip.active {
            color: var(--text);
            border-color: currentColor;
        }

        .layer-chip:hover {
            color: var(--text);
        }

        .layer-color {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        #control-buttons {
            display: flex;
            gap: 8px;
        }

        #control-buttons select, #control-buttons button {
            background: var(--panel-2);
            color: var(--text);
            border: 1px solid #475569;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 13px;
        }

        #control-buttons button {
            cursor: pointer;
        }

        #control-buttons button:hover {
            background: #475569;
        }

        #markets {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #trends {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .trend-section {
            background: var(--panel);
            border: 1px solid var(--panel-2);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .trend-section h4 {
            margin: 0 0 12px 0;
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .trend-subtitle {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .trend-hero {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 12px;
        }

        .trend-big {
            font-size: 24px;
            font-weight: 700;
        }

        .trend-delta {
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 10px;
        }

        .trend-delta.up {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
        }

        .trend-delta.down {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
        }

        .trend-chart {
            height: 140px;
        }

        .trend-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 13px;
        }

        .trend-row:last-child {
            border-bottom: none;
        }

        .trend-name {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .trend-bar-bg {
            flex: 1;
            height: 6px;
            background: var(--panel-2);
            border-radius: 3px;
            margin: 0 10px;
            overflow: hidden;
        }

        .trend-bar-fill {
            height: 100%;
            border-radius: 3px;
        }

        .trend-days {
            display: flex;
            gap: 6px;
            margin: 0 0 12px 0;
        }

        .trend-days button {
            background: var(--panel-2);
            border: 1px solid var(--panel-2);
            color: var(--text-muted);
            border-radius: 12px;
            padding: 4px 10px;
            font-size: 12px;
            cursor: pointer;
        }

        .trend-days button.active {
            border-color: var(--accent);
            color: var(--text);
        }

        .market-card {
            background: var(--panel);
            border: 1px solid var(--panel-2);
            border-radius: 8px;
            padding: 12px;
        }

        .market-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .market-prices {
            display: flex;
            gap: 12px;
            font-size: 13px;
            margin: 8px 0;
        }

        .market-price {
            background: var(--panel-2);
            padding: 4px 10px;
            border-radius: 12px;
        }

        .bet-form {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .bet-form input {
            width: 70px;
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--panel-2);
            border-radius: 4px;
            padding: 4px 8px;
        }

        .btn-yes {
            background: #22c55e;
            color: #000;
            border: none;
            border-radius: 4px;
            padding: 4px 10px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-no {
            background: #ef4444;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 4px 10px;
            font-weight: 600;
            cursor: pointer;
        }

        .portfolio-bar {
            padding: 8px 12px;
            background: var(--panel-2);
            border-bottom: 1px solid var(--panel-2);
            font-size: 12px;
            display: flex;
            justify-content: space-between;
        }

        #feed {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .feed-status {
            padding: 8px 12px;
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            border-bottom: 1px solid var(--panel-2);
        }

        .article-card {
            background: var(--panel);
            border: 1px solid var(--panel-2);
            border-radius: 8px;
            padding: 12px;
            cursor: pointer;
            transition: border-color 0.15s;
        }

        .article-card:hover, .article-card.active {
            border-color: var(--accent);
        }

        .article-header {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            margin-bottom: 6px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
            margin-top: 4px;
        }

        .article-title {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.35;
            margin: 0;
        }

        .article-meta {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 6px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .article-meta span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .article-summary {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 6px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .article-actions {
            margin-top: 8px;
            display: flex;
            gap: 10px;
            font-size: 11px;
        }

        .article-actions a {
            color: var(--accent);
            text-decoration: none;
        }

        .article-actions a:hover {
            text-decoration: underline;
        }

        #map {
            height: 100%;
            width: 100%;
            background: #0b1120;
        }

        footer {
            grid-column: 1 / -1;
            background: var(--panel);
            border-top: 1px solid var(--panel-2);
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
        }

        #status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .pulse {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .legend {
            position: absolute;
            bottom: 40px;
            right: 12px;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid var(--panel-2);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 11px;
            z-index: 1000;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 4px 0;
        }

        .map-toast {
            position: absolute;
            bottom: 84px;
            left: 12px;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid var(--panel-2);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12px;
            z-index: 1000;
            display: none;
        }

        #detail-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 6, 23, 0.85);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        #detail-modal.visible {
            display: flex;
        }

        .detail-panel {
            background: var(--panel);
            border: 1px solid var(--panel-2);
            border-radius: 12px;
            width: 100%;
            max-width: 640px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
        }

        .detail-title {
            font-size: 18px;
            font-weight: 600;
            line-height: 1.35;
            margin: 0;
        }

        .detail-close {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
        }

        .detail-close:hover {
            color: var(--text);
        }

        .detail-meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .detail-body {
            font-size: 14px;
            line-height: 1.55;
            color: #e2e8f0;
            white-space: pre-wrap;
        }

        .detail-actions {
            margin-top: 18px;
            display: flex;
            gap: 12px;
        }

        .detail-actions a, .detail-actions button {
            background: var(--panel-2);
            color: var(--text);
            border: 1px solid var(--panel-2);
            border-radius: 6px;
            padding: 8px 14px;
            text-decoration: none;
            font-size: 13px;
            cursor: pointer;
        }

        .detail-actions a:hover, .detail-actions button:hover {
            border-color: var(--accent);
        }

        .map-node-nav {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 1200;
            display: flex;
            gap: 6px;
        }

        .map-node-nav button {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: 1px solid var(--panel-2);
            background: rgba(15, 23, 42, 0.92);
            color: var(--text);
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .map-node-nav button:hover,
        .map-node-nav button:focus-visible {
            border-color: var(--accent);
            color: var(--accent);
        }

        .article-card.focused,
        .market-card.focused,
        .trend-row[data-hotspot-id].focused,
        .menu-item.focused {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent);
        }

        #agent {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 12px;
        }

        #agent.hidden { display: none !important; }

        .agent-log {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 12px;
            background: var(--bg);
            border: 1px solid var(--panel-2);
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .agent-message {
            max-width: 85%;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.45;
            white-space: pre-wrap;
        }

        .agent-message.user {
            align-self: flex-end;
            background: var(--panel-2);
            color: var(--text);
        }

        .agent-message.assistant {
            align-self: flex-start;
            background: rgba(56, 189, 248, 0.12);
            color: #e0f2fe;
            border: 1px solid rgba(56, 189, 248, 0.25);
        }

        .agent-message.error {
            align-self: flex-start;
            background: rgba(239, 68, 68, 0.12);
            color: #fecaca;
            border: 1px solid rgba(239, 68, 68, 0.25);
        }

        /* Which tools backed the answer below it. Small, dimmed, and left
           aligned so it reads as provenance rather than part of the reply. */
        .agent-progress {
            font-size: 12px;
            color: var(--muted, #8b949e);
            font-style: italic;
            padding: 2px 0;
        }

        .agent-sources {
            align-self: flex-start;
            max-width: 85%;
            font-size: 11px;
            line-height: 1.3;
            color: var(--text-dim);
            border-left: 2px solid rgba(56, 189, 248, 0.4);
            padding-left: 8px;
            margin-bottom: 2px;
        }

        .agent-controls {
            display: flex;
            gap: 8px;
        }

        .agent-controls textarea {
            flex: 1;
            min-height: 56px;
            max-height: 140px;
            resize: vertical;
            background: var(--bg);
            color: var(--text);
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 10px;
            font-family: inherit;
            font-size: 13px;
        }

        .agent-controls textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .agent-deep-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--muted, #8b949e);
            cursor: pointer;
            user-select: none;
        }

        .agent-deep-toggle input { accent-color: var(--accent, #58a6ff); }

        .agent-toolbar {
            display: flex;
            gap: 8px;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }

        .agent-toolbar select {
            flex: 1;
            min-width: 0;
            background: rgba(255, 255, 255, 0.04);
            color: inherit;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 6px 8px;
            font-size: 12px;
            cursor: pointer;
        }

        .agent-toolbar button {
            background: rgba(255, 255, 255, 0.08);
            color: inherit;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .agent-toolbar button:hover { background: rgba(255, 255, 255, 0.14); }
        .agent-toolbar button:disabled { opacity: 0.5; cursor: default; }
        .agent-toolbar button.active { border-color: var(--accent, #58a6ff); }

        .agent-controls button {
            background: var(--accent);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            padding: 0 18px;
            font-weight: 700;
            cursor: pointer;
        }

        .agent-controls button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .agent-message b, .agent-message strong { font-weight: 700; }

        .agent-message i, .agent-message em { font-style: italic; }

        .agent-message code {
            background: rgba(255, 255, 255, 0.12);
            padding: 1px 5px;
            border-radius: 4px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.95em;
        }

        .agent-message pre {
            background: rgba(0, 0, 0, 0.35);
            padding: 10px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 6px 0;
            white-space: pre;
        }

        .agent-message pre code {
            background: transparent;
            padding: 0;
        }

        .agent-message h1, .agent-message h2, .agent-message h3, .agent-message h4 {
            margin: 8px 0 4px;
            font-weight: 700;
            line-height: 1.2;
        }

        .agent-message h1 { font-size: 16px; }
        .agent-message h2 { font-size: 15px; }
        .agent-message h3 { font-size: 14px; }
        .agent-message h4 { font-size: 13px; }

        .agent-message ul, .agent-message ol {
            margin: 4px 0;
            padding-left: 20px;
        }

        .agent-message li { margin: 2px 0; }

        .agent-message blockquote {
            border-left: 3px solid var(--accent);
            padding-left: 10px;
            margin: 6px 0;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <h1>🌐 Geonews <span class="badge">Primary Sources</span></h1>
            <div class="header-right">
                <div id="status-pill"><span class="pulse"></span> Live</div>
                <button id="menu-btn" aria-label="Open menu" title="Menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </header>

        <div id="menu-overlay"></div>
        <div id="menu-drawer">
            <button class="drawer-close" id="menu-close">&times;</button>
            <button class="menu-item" data-tab="feed">📰 Primary-source feed</button>
            <button class="menu-item" data-tab="markets">📈 Prediction markets</button>
            <button class="menu-item" data-tab="trends">📊 Trend analyzer</button>
            <button class="menu-item" data-tab="agent">🤖 Local agent</button>
        </div>

        <div id="left-pane">
            <div id="tabs">
                <button class="tab active" data-tab="feed">Feed</button>
                <button class="tab" data-tab="markets">Markets</button>
                <button class="tab" data-tab="trends">Trends</button>
                <button class="tab" data-tab="agent">Agent</button>
            </div>
            <div id="controls">
                <div id="search-row">
                    <input id="search-input" type="text" placeholder="Search titles, sources, locations…" autocomplete="off">
                </div>
                <div id="layers">
                    <label class="layer-chip active" data-type="conflict"><span class="dot layer-color" style="background: var(--conflict)"></span> Conflict</label>
                    <label class="layer-chip active" data-type="economic"><span class="dot layer-color" style="background: var(--economic)"></span> Economic</label>
                    <label class="layer-chip active" data-type="political"><span class="dot layer-color" style="background: var(--political)"></span> Political</label>
                    <label class="layer-chip active" data-type="environmental"><span class="dot layer-color" style="background: var(--environmental)"></span> Environmental</label>
                    <label class="layer-chip active" data-type="other"><span class="dot layer-color" style="background: var(--other)"></span> Other</label>
                </div>
                <div id="control-buttons">
                    <select id="filter-region">
                        <option value="">All regions</option>
                    </select>
                    <button id="btn-ingest">Refresh</button>
                    <button id="btn-process">Process</button>
                </div>
            </div>
            <div class="feed-status" id="feed-status">Loading…</div>
            <div id="feed"></div>
            <div id="markets" class="hidden"></div>
            <div id="trends" class="hidden"></div>
            <div id="agent" class="hidden">
                <div class="agent-toolbar">
                    <select id="agent-history" aria-label="Previous conversations">
                        <option value="">Recent conversations…</option>
                    </select>
                    <button id="agent-new-chat" title="Start a new conversation">New chat</button>
                    <button id="agent-delete-chat" title="Delete the selected conversation" hidden>Delete</button>
                </div>
                <div class="agent-log" id="agent-log">
                    <div class="agent-message assistant">I’m connected to the local bigus_dickus agent. Ask me about any article, region, or ask for a threat briefing.</div>
                </div>
                <div class="agent-controls">
                    <label class="agent-deep-toggle">
                        <input type="checkbox" id="agent-deep">
                        Deep research
                    </label>
                    <textarea id="agent-input" placeholder="Ask the local agent…"></textarea>
                    <button id="agent-send">Send</button>
                </div>
            </div>
        </div>

        <div style="position: relative;">
            <div id="map"></div>
            <div class="map-node-nav">
                <button id="map-prev" title="Previous mapped article" aria-label="Previous article">‹</button>
                <button id="map-next" title="Next mapped article" aria-label="Next article">›</button>
            </div>
            <div class="legend">
                <div class="legend-item"><span class="dot" style="background: var(--conflict)"></span> Conflict</div>
                <div class="legend-item"><span class="dot" style="background: var(--economic)"></span> Economic</div>
                <div class="legend-item"><span class="dot" style="background: var(--political)"></span> Political</div>
                <div class="legend-item"><span class="dot" style="background: var(--environmental)"></span> Environmental</div>
                <div class="legend-item"><span class="dot" style="background: var(--other)"></span> Other</div>
            </div>
            <div class="map-toast" id="map-toast">Click a marker or the map to explore.</div>
        </div>

        <footer>
            <span id="footer-stats">Loading stats…</span>
            <span id="footer-freshness">—</span>
        </footer>
    </div>

    <div id="detail-modal">
        <div class="detail-panel" id="detail-panel">
            <div class="detail-header">
                <h2 class="detail-title" id="detail-title"></h2>
                <button class="detail-close" id="detail-close">&times;</button>
            </div>
            <div class="detail-meta" id="detail-meta"></div>
            <div class="detail-body" id="detail-body"></div>
            <div class="detail-actions" id="detail-actions"></div>
        </div>
    </div>

    <script src="/static/vendor/leaflet.js"></script>
    <script src="/static/vendor/leaflet.markercluster.js"></script>
    <script src="/static/trends.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>

# ============================================================
# TIER 3 — Simple HTML scraping (httpx + BeautifulSoup)
# ============================================================

[sources.pboc]
type = "scrape_simple"
url = "https://www.pbc.gov.cn/en/3688110/3688172/index.html"
category = "central_bank"
region = "China"
language = "en"
priority = 1
enabled = false
link_selector = "a"

[sources.kremlin_web]
type = "rss"
url = "http://en.kremlin.ru/events/president/news/feed"
category = "government"
region = "Russia"
language = "en"
priority = 2

[sources.wto]
type = "scrape_simple"
url = "https://www.wto.org/english/news_e/news_e.htm"
category = "international_org"
region = "Global"
language = "en"
priority = 2
# The news list is rendered client-side and no longer has a server-side feed,
# so the simple scraper matches nothing. Left disabled until a scraper that
# can execute JS (or a real feed) is wired up.
enabled = false
link_selector = "#content a[href*='/news_e/']"

[sources.iaea]
type = "scrape_simple"
url = "https://www.iaea.org/news"
category = "international_org"
region = "Global"
language = "en"
priority = 2
enabled = false
link_selector = "h4.field-content a"

# ============================================================
# TIER 4 — Playwright scraping (JS-heavy government sites)
# These are disabled by default and enabled in Phase 4/5.
# ============================================================

[sources.whitehouse]
type = "scrape_playwright"
url = "https://www.whitehouse.gov/briefing-room/"
category = "government"
region = "United States"
language = "en"
priority = 2
enabled = false
link_selector = "article a"

[sources.state_dept]
type = "scrape_playwright"
url = "https://www.state.gov/press-releases/"
category = "government"
region = "United States"
language = "en"
priority = 2
enabled = false
link_selector = "article a"

[sources.who]
type = "scrape_playwright"
url = "https://www.who.int/news-room/releases"
category = "international_org"
region = "Global"
language = "en"
priority = 2
enabled = false
link_selector = "article a"

[sources.nato]
type = "scrape_playwright"
url = "https://www.nato.int/cps/en/natohq/news.htm"
category = "international_org"
region = "Global"
language = "en"
priority = 2
enabled = false
link_selector = "h3 a"


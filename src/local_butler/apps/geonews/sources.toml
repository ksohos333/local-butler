# Geonews primary source configuration.
# These are official channels where governments, central banks, militaries,
# and international organizations publish announcements FIRST.

# ============================================================
# TIER 1 — RSS feeds (preferred: structured, low-friction)
# ============================================================

[sources.federal_reserve]
type = "rss"
url = "https://www.federalreserve.gov/feeds/press_all.xml"
category = "central_bank"
region = "United States"
language = "en"
priority = 1

[sources.ecb]
type = "rss"
url = "https://www.ecb.europa.eu/rss/press.html"
category = "central_bank"
region = "European Union"
language = "en"
priority = 1

[sources.bank_of_england]
type = "rss"
url = "https://www.bankofengland.co.uk/rss/news"
category = "central_bank"
region = "United Kingdom"
language = "en"
priority = 1

[sources.bank_of_japan]
type = "rss"
url = "https://www.boj.or.jp/en/rss/whatsnew.xml"
category = "central_bank"
region = "Japan"
language = "en"
priority = 1

[sources.rbi]
type = "rss"
url = "https://www.rbi.org.in/Scripts/rss.aspx"
category = "central_bank"
region = "India"
language = "en"
priority = 1
# /Scripts/rss.aspx now serves an HTML page, not a feed, so feedparser finds
# no entries. Disabled until a working feed URL is known.
enabled = false

[sources.un_news]
type = "rss"
url = "https://news.un.org/feed/subscribe/en/news/all/rss.xml"
category = "international_org"
region = "Global"
language = "en"
priority = 1

[sources.eu_commission]
type = "rss"
url = "https://ec.europa.eu/commission/presscorner/api/rss"
category = "government"
region = "European Union"
language = "en"
priority = 1



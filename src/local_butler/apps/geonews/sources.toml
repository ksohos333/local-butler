# Truth Social / Donald Trump has no official RSS feed.
# Use an RSS-Bridge Twitter bridge pointed at @realDonaldTrump if RSS-Bridge is
# deployed locally, or enable an OpenClaw/Playwright scraper for direct grabs.
[sources.truth_social]
type = "rss"
url = "http://127.0.0.1:4000/?action=display&bridge=Twitter&u=realDonaldTrump&format=Atom"
category = "social_media"
region = "United States"
language = "en"
priority = 3
enabled = false


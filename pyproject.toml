[project]
name = "local-butler"
version = "0.1.0"
description = "Local Butler: money tracker, LLM brain, voice MCP"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.20.0",
    "beautifulsoup4>=4.12.0",
    "certifi>=2025.0",
    "fastapi>=0.141.1",
    "feedparser>=6.0.0",
    "geopy>=2.4.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.6",
    "lxml>=5.0.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "python-telegram-bot[job-queue]>=21.0",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.53.0",
]

[project.scripts]
local-butler = "local_butler:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
